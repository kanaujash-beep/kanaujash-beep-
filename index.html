    async function initCloudSync() {
      const statusEl = document.getElementById('cloud-sync-status');
      loadLocalFallback();
      syncHeaderAndBioUI();
      renderAll();

      if (!firebaseConfig) {
        if (statusEl) statusEl.innerText = '● GITHUB / LOCAL READY';
        return;
      }
      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (initialAuthToken) {
          await signInWithCustomToken(auth, initialAuthToken);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (user) => {
          currentUser = user;
          if (!user) return;
          if (statusEl) statusEl.innerText = '● CLOUD ARCHIVE SYNCED';
          subscribeToCloudData();
        });
      } catch (err) {
        if (statusEl) statusEl.innerText = '● LOCAL STORAGE MODE';
      }
    }

    function subscribeToCloudData() {
      if (!db || !currentUser) return;

      // 1. Listen to public site settings & owner passcode hash
      const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'profile');
      if (settingsUnsubscribe) settingsUnsubscribe();
      settingsUnsubscribe = onSnapshot(settingsRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          if (data.title) state.title = data.title;
          if (data.bio) state.bio = data.bio;
          if (data.adminPasscode) cloudAdminPasscode = data.adminPasscode;
          syncHeaderAndBioUI();
        } else {
          // Seed initial profile settings in cloud
          setDoc(settingsRef, {
            title: state.title,
            bio: state.bio,
            adminPasscode: cloudAdminPasscode
          }).catch(() => {});
        }
      }, () => {});

      // 2. Listen to public archive entries collection
      const entriesCol = collection(db, 'artifacts', appId, 'public', 'data', 'entries');
      if (entriesUnsubscribe) entriesUnsubscribe();
      entriesUnsubscribe = onSnapshot(entriesCol, (snapshot) => {
        if (snapshot.empty) {
          // Seed initial sample entries once so visitors immediately see rich content
          SAMPLE_ENTRIES.forEach((sample, idx) => {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'entries', sample.id);
            setDoc(docRef, { ...sample, createdAt: Date.now() - idx * 60000 }).catch(() => {});
          });
        } else {
          const loaded = [];
          snapshot.forEach((d) => loaded.push(d.data()));
          loaded.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          state.entries = loaded;
          renderAll();
        }
      }, () => {});
    }

    function processImageFile(file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX = 900;
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) {
            if (w > h) { h = Math.round((h * MAX) / w); w = MAX; }
            else { w = Math.round((w * MAX) / h); h = MAX; }
          }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
          state.composerMediaDataUrl = dataUrl;
          state.composerSvgType = null;
          showComposerPreview(dataUrl);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

      saveLocalFallback();
      if (!db || !currentUser) return;

    function downloadBackup() {
      const payload = { siteTitle: state.title, bio: state.bio, exportedAt: new Date().toISOString(), entries: state.entries };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'archive'}-backup.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Backup downloaded (.json)');
    }

    async function resetDemoEntries() {
      if (!state.isAdmin) return;
      for (let i = 0; i < SAMPLE_ENTRIES.length; i++) {
        const sample = { ...SAMPLE_ENTRIES[i], createdAt: Date.now() - i * 60000 };
        await saveEntryToCloud(sample);
      }
      showToast('Sample entries restored to cloud');
    }

    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'btn-invert px-4 py-2 rounded-full font-mono text-[11px] uppercase tracking-wider backdrop-blur-xl transition-all duration-300 transform translate-y-2 opacity-0';
      t.innerText = msg;
      c.appendChild(t);
      requestAnimationFrame(() => t.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        t.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => t.remove(), 300);
      }, 2400);
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));

      toggleAccordion,
      handleImageUpload,
      handleImageUrlInput,
      useSampleArt,
      clearComposerMedia,
      setComposerTone,
      submitNewEntry,
      openReader,
      setReaderTone,
      closeReader,
      deleteCurrentEntry,
      downloadBackup,
      resetDemoEntries,
      state
    });

    window.addEventListener('resize', () => { buildOrbitalRing(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeComposer(); closeReader(); closeAdminModal(); }
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
